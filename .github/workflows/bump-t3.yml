# Tracks upstream `t3` npm releases and opens a version-bump PR.
# Umbrel only offers an app update when manifest `version` changes, so a human
# (or agent) still merges the PR — umbrelOS never auto-applies updates.
# opencode needs no workflow: the container bootstrap upgrades it on start.
name: Bump t3 upstream release

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-t3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bump t3 pin, manifest version and release notes
        id: bump
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          compose_path = Path('lykhoris-t3code/docker-compose.yml')
          manifest_path = Path('lykhoris-t3code/umbrel-app.yml')

          latest = subprocess.check_output(
              ['npm', 'view', 't3', 'version'], text=True
          ).strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', latest), f'unexpected version: {latest}'

          manifest = manifest_path.read_text()
          current = re.search(
              r'^version:\s*["\']?([^"\']+)["\']?\s*$', manifest, re.M
          ).group(1)
          # Manifest scheme is <t3-version>[.<store-rev>]; compare the t3 base.
          base = re.sub(r'\.\d+$', '', current) if current.count('.') == 3 else current

          def key(v):
              return tuple(int(x) for x in v.split('.')[:3])

          if key(latest) <= key(base):
              print(f'up to date (manifest {current}, upstream {latest})')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('updated=false\n')
              raise SystemExit(0)

          compose = compose_path.read_text()
          new_compose, n = re.subn(r't3@[0-9A-Za-z._-]+', f't3@{latest}', compose)
          assert n == 1, f'expected 1 t3 pin, found {n}'
          compose_path.write_text(new_compose)

          new_manifest, n = re.subn(
              r'^version:\s*["\']?[^"\']+["\']?\s*$',
              f'version: "{latest}"',
              manifest,
              count=1,
              flags=re.M,
          )
          assert n == 1, 'version line not found'
          notes = (
              f'  Track upstream t3 {latest} '
              '(headless serve --mode web, port 3773).\n'
              '  Upstream notes: https://github.com/pingdotgg/t3code/releases'
          )
          new_manifest, n = re.subn(
              r'^releaseNotes: >-\n(?:  .*\n?)+',
              f'releaseNotes: >-\n{notes}\n',
              new_manifest,
              count=1,
              flags=re.M,
          )
          assert n == 1, 'releaseNotes block not found'
          manifest_path.write_text(new_manifest)

          print(f'bumped {current} -> {latest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('updated=true\n')
              fh.write(f'version={latest}\n')
          PY

      - name: Open pull request
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.bump.outputs.version }}"
          branch="automation/bump-t3-$v"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '[1-9]'; then
            echo "PR already open for $v, skipping"
            exit 0
          fi
          git checkout -b "$branch"
          git add lykhoris-t3code/docker-compose.yml lykhoris-t3code/umbrel-app.yml
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Track upstream t3 $v"
          git push -u origin "$branch"
          gh pr create --title "Track upstream t3 $v" --body \
            "Weekly automation: bump t3 pin, manifest version and release notes to \`$v\`. Merge to release — Umbrel offers it as an update within ~5 minutes of merge."
