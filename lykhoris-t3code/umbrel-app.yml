category: developer
version: "0.0.40"
port: 3773
description: >-
  T3 Code is an open-source (MIT) "agent harness control surface" by pingdotgg.
  It lets you control coding agents running on your machine from a web app,
  Electron desktop app, or mobile app (iOS/Android).


  Works with your existing subscriptions for Claude Code, Codex CLI, Cursor CLI,
  Grok Build, and OpenCode. Install and authenticate at least one provider, then
  pair a client (QR / pairing URL printed in the app logs on first start).


  This package runs the official npm release (t3@0.0.40) headless via
  `t3 serve --mode web` on port 3773. State lives in the app's data folder
  (/data -> userdata/state.sqlite) and your agent workspace in /workspace, both
  persisted across restarts/updates. T3 Connect is supported: sign in once via
  `t3 connect login/link --base-dir /data --headless` inside the container and
  reach this Umbrel from your signed-in phone/desktop with no port forwarding
  (see this store's README).


  NOTE: the opencode harness binary is bundled via a first-boot bootstrap into
  the persisted /data/bin (watch for [bootstrap] in the logs). Auth stays
  manual and per-user: open Umbrel Terminal and run
  `docker exec -it lykhoris-t3code_web_1 sh`, then `opencode auth login`.
  Auth persists in /data across restarts/updates.
developer: pingdotgg (T3 Tools)
website: https://t3.codes
submitter: LyKhoris
submission: https://github.com/LyKhoris/Umbrel-Store
